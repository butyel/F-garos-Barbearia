<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artigo - Figaro's Barbearia</title>
  <meta name="description" content="">
  <meta name="keywords" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:image" content="">
  <meta property="og:type" content="article">
  <meta property="og:url" content="">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0a0a0a;
      --charcoal: #141414;
      --dark: #1e1e1e;
      --gold: #c9a84c;
      --gold-light: #e8c96a;
      --white: #ffffff;
      --gray: #888888;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.8;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .container-wide {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(201,168,76,0.1);
      padding: 12px 0;
    }
    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
    }
    .logo span {
      color: var(--white);
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
      font-size: 0.8rem;
      display: block;
    }
    .nav-menu {
      display: flex;
      gap: 25px;
      align-items: center;
    }
    .nav-link {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s;
    }
    .nav-link:hover { color: var(--gold); }
    .btn {
      background: var(--gold);
      color: var(--black);
      padding: 10px 22px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.3s;
    }
    .btn:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
    }

    /* ARTICLE */
    .article-wrapper {
      padding-top: 100px;
      padding-bottom: 60px;
    }
    .article-header {
      margin-bottom: 40px;
    }
    .article-header .category {
      font-size: 0.8rem;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .article-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      line-height: 1.2;
      margin-bottom: 20px;
    }
    .article-header .meta {
      display: flex;
      gap: 20px;
      color: var(--gray);
      font-size: 0.9rem;
      flex-wrap: wrap;
    }
    .article-header .meta span { display: flex; align-items: center; gap: 6px; }
    .article-featured-image {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 40px;
    }

    .article-content {
      font-size: 1.05rem;
      line-height: 1.9;
      color: rgba(255,255,255,0.9);
    }
    .article-content h1,
    .article-content h2,
    .article-content h3 {
      font-family: 'Playfair Display', serif;
      color: var(--white);
      margin-top: 40px;
      margin-bottom: 18px;
      line-height: 1.3;
    }
    .article-content h2 { font-size: 1.8rem; }
    .article-content h3 { font-size: 1.4rem; }
    .article-content p {
      margin-bottom: 20px;
    }
    .article-content a {
      color: var(--gold);
      text-decoration: underline;
    }
    .article-content a:hover {
      color: var(--gold-light);
    }
    .article-content img {
      max-width: 100%;
      border-radius: 8px;
      margin: 30px 0;
    }
    .article-content blockquote {
      border-left: 3px solid var(--gold);
      padding: 15px 20px;
      margin: 30px 0;
      background: rgba(201,168,76,0.05);
      border-radius: 0 8px 8px 0;
      font-style: italic;
      color: rgba(255,255,255,0.8);
    }
    .article-content ul,
    .article-content ol {
      margin: 20px 0;
      padding-left: 25px;
    }
    .article-content li {
      margin-bottom: 10px;
    }
    .article-content .ql-align-center { text-align: center; }
    .article-content .ql-align-right { text-align: right; }

    /* KEYWORDS */
    .article-keywords {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .article-keywords .tag {
      display: inline-block;
      padding: 5px 14px;
      background: rgba(201,168,76,0.1);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 15px;
      font-size: 0.8rem;
      color: var(--gold);
      margin: 4px;
      text-decoration: none;
    }

    /* SHARE */
    .share-section {
      margin-top: 30px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .share-section span {
      color: var(--gray);
      font-size: 0.9rem;
    }
    .share-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.3s;
    }
    .share-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* BACK TO BLOG */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gray);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 30px;
      transition: color 0.3s;
    }
    .back-link:hover { color: var(--gold); }

    /* LOADING */
    .loading-state {
      text-align: center;
      padding: 120px 20px;
      color: var(--gray);
    }
    .loading-state .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(201,168,76,0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* CTA */
    .cta-section {
      padding: 60px 0;
      background: var(--gold);
      text-align: center;
    }
    .cta-section h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--black);
      margin-bottom: 15px;
    }
    .cta-section p {
      color: rgba(0,0,0,0.7);
      margin-bottom: 25px;
    }
    .cta-section .btn {
      background: var(--black);
      color: var(--white);
    }

    /* FOOTER */
    footer {
      background: var(--black);
      padding: 40px 0;
      border-top: 1px solid rgba(255,255,255,0.1);
      text-align: center;
    }
    footer p {
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
    }
    footer a { color: var(--gold); text-decoration: none; }

    /* WHATSAPP */
    .whatsapp-float {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 60px; height: 60px;
      background: #25d366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(37,211,102,0.4);
      z-index: 1000;
      transition: transform 0.3s;
      text-decoration: none;
    }
    .whatsapp-float:hover { transform: scale(1.1); }
    .whatsapp-float svg { width: 30px; height: 30px; fill: white; }

    /* RESPONSIVE */
    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
    }
    .mobile-menu-btn span {
      display: block;
      width: 25px;
      height: 3px;
      background: var(--gold);
      margin: 5px 0;
      transition: 0.3s;
    }

    @media (max-width: 968px) {
      .mobile-menu-btn { display: block; }
      .nav-menu {
        position: fixed;
        top: 60px; left: 0; right: 0;
        background: rgba(10,10,10,0.98);
        flex-direction: column;
        padding: 20px;
        gap: 15px;
        display: none;
        border-bottom: 1px solid var(--gold);
      }
      .nav-menu.active { display: flex; }
      .nav-link { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
      .article-header h1 { font-size: 1.8rem; }
    }

    @media (max-width: 600px) {
      .container { padding: 0 15px; }
      .logo { font-size: 1.3rem; }
      .logo span { font-size: 0.7rem; }
      .article-wrapper { padding-top: 80px; }
      .article-header h1 { font-size: 1.5rem; }
      .article-content { font-size: 1rem; }
      .cta-section h2 { font-size: 1.5rem; }
      .whatsapp-float { width: 50px; height: 50px; bottom: 20px; right: 20px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->

  <!-- WHATSAPP -->

  <script>
    function toggleMenu() {
      document.getElementById('navMenu').classList.toggle('active');
    }
    document.querySelectorAll('.nav-link').forEach(function(l) {
      l.addEventListener('click', function() {
        document.getElementById('navMenu').classList.remove('active');
      });
    });
  </script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="js/firebase.js"></script>

  <script>
    function getParam(name) {
      var url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    function loadArticle() {
      var slug = getParam('slug');
      var container = document.getElementById('articleContent');

      if (!slug) {
        container.innerHTML = '<div class="empty-state" style="text-align:center;padding:60px 0;"><div class="icon" style="font-size:3rem;">🔍</div><h4>Artigo não encontrado</h4><p>Nenhum slug foi especificado.</p></div>';
        return;
      }

      db.ref('posts').once('value')
        .then(function(snapshot) {
          var data = snapshot.val();
          var post = null;

          if (data) {
            Object.keys(data).forEach(function(key) {
              var p = { id: key, ...data[key] };
              if (p.slug === slug && p.status === 'published') {
                post = p;
              }
            });
          }

          if (!post) {
            container.innerHTML = '<div class="empty-state" style="text-align:center;padding:60px 0;"><div class="icon" style="font-size:3rem;">📭</div><h4>Artigo não encontrado</h4><p>O artigo que você procura não está disponível.</p></div>';
            return;
          }

          renderArticle(post);
          updateSEO(post);
        })
        .catch(function(err) {
          console.error('Erro ao carregar artigo:', err);
          container.innerHTML = '<div class="empty-state" style="text-align:center;padding:60px 0;"><div class="icon" style="font-size:3rem;">😕</div><h4>Erro ao carregar</h4><p>Tente novamente mais tarde.</p></div>';
        });
    }

    function renderArticle(post) {
      var container = document.getElementById('articleContent');
      var date = post.createdAt ? new Date(post.createdAt).toLocaleDateString('pt-BR') : '';
      var hasImage = post.featuredImage && post.featuredImage.startsWith('http');
      var keywords = post.keywords || [];
      var pageUrl = encodeURIComponent(window.location.href);
      var pageTitle = encodeURIComponent(post.title || 'Artigo');

      var html = '';

      // Featured image
      if (hasImage) {
        html += '<img class="article-featured-image" src="' + escapeHtml(post.featuredImage) + '" alt="' + escapeHtml(post.title) + '">';
      }

      // Header
      html += '<div class="article-header">';
      if (post.category) {
        html += '<div class="category">' + escapeHtml(post.category) + '</div>';
      }
      html += '<h1>' + escapeHtml(post.title) + '</h1>';
      html += '<div class="meta">';
      if (date) html += '<span>📅 ' + date + '</span>';
      if (post.author) html += '<span>✍️ ' + escapeHtml(post.author) + '</span>';
      html += '</div></div>';

      // Content
      html += '<div class="article-content">' + post.content + '</div>';

      // Keywords
      if (keywords.length > 0) {
        html += '<div class="article-keywords">';
        keywords.forEach(function(k) {
          html += '<a class="tag" href="/blog.html?tag=' + encodeURIComponent(k) + '">#' + escapeHtml(k) + '</a>';
        });
        html += '</div>';
      }

      // Share
      html += '<div class="share-section">';
      html += '<span>Compartilhar:</span>';
      html += '<a class="share-btn" href="https://wa.me/?text=' + pageTitle + '%20' + pageUrl + '" target="_blank">📱 WhatsApp</a>';
      html += '<a class="share-btn" href="https://www.facebook.com/sharer/sharer.php?u=' + pageUrl + '" target="_blank">📘 Facebook</a>';
      html += '<a class="share-btn" href="https://twitter.com/intent/tweet?text=' + pageTitle + '&url=' + pageUrl + '" target="_blank">🐦 Twitter</a>';
      html += '</div>';

      container.innerHTML = html;

      // Scroll to top
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateSEO(post) {
      var title = (post.title || 'Artigo') + ' - Figaro\'s Barbearia';
      var desc = post.metaDescription || 'Leia o artigo ' + post.title + ' no blog da Figaro\'s Barbearia.';
      var keywords = (post.keywords || []).join(', ');
      var image = post.featuredImage || '';
      var url = window.location.href;

      document.title = title;
      document.querySelector('meta[name="description"]').setAttribute('content', desc);
      if (keywords) {
        document.querySelector('meta[name="keywords"]').setAttribute('content', keywords);
      }
      document.querySelector('meta[property="og:title"]').setAttribute('content', title);
      document.querySelector('meta[property="og:description"]').setAttribute('content', desc);
      document.querySelector('meta[property="og:url"]').setAttribute('content', url);
      if (image) {
        document.querySelector('meta[property="og:image"]').setAttribute('content', image);
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      var d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    loadArticle();
  </script>
</body>
</html>
